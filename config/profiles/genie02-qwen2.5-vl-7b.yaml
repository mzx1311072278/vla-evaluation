# TEMPLATE ONLY — services read runtime copies from data/profiles (VLA_EVAL_PROFILES_ROOT). Edits here do NOT take effect.
name: genie02-qwen2.5-vl-7b
version: 1.0.0
adapter: genie02
plugin: genie02-attempt-eval
image_key: observation.images.right_wrist
vlm:
  backend: local
  model_family: qwen2_5_vl
  model_path: /czj/model/Qwen2.5-VL-7B-Instruct
  prompt_version: genie02-attempt-v1
  sampling:
    max_global_frames: 32
    global_sample_interval: 1.0
    max_dense_frames: 16
    dense_sample_interval: 0.5
    dense_region: full
  max_image_size: 336
  max_new_tokens: 256
review:
  mode: manual_review
  confidence_threshold: 0.7
  min_episode_duration: 3.0
  min_sampled_frames: 3
outputs:
  required:
    - episode_metrics.csv
    - metrics_core.json
    - report_*.md
  optional:
    - smoothness_curve.svg
    - attempt_eval/attempt_summary.json
    - attempt_eval/attempt_summary.csv
