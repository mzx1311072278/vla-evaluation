data_root: /srv/vla-eval/data
# Default: strict. Use data_root_boundary only when shared ancestors are managed
# by the storage platform and data_root itself is private to this service.
storage_trust_mode: strict
database_url: sqlite:////srv/vla-eval/data/db/app.sqlite3
redis_url: redis://redis:6379/0
model_path: /srv/vla-eval/data/models/Qwen2.5-VL-7B-Instruct
session_secret: "${VLA_EVAL_SESSION_SECRET}"

local_sources:
  this-host:
    roots:
      - /mnt/vla-datasets

remote_sources:
  lab-a:
    host: 10.0.0.8
    port: 22
    username: eval-read
    key_path: /run/secrets/lab_a_key
    known_hosts_path: /run/secrets/known_hosts
    roots:
      - /data/rollouts
