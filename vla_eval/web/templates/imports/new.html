{% extends "base.html" %}
{% block title %}新建导入 | VLA Evaluation{% endblock %}
{% block content %}
  <section>
    <p class="eyebrow">数据接入</p><h1>新建导入</h1>
    <form method="post" action="/imports" class="form-layout">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="source-name">远程源
        <select id="source-name" name="source_name" required>
          {% for name, source in remote_sources.items() %}<option value="{{ name }}">{{ name }}</option>{% endfor %}
        </select>
      </label>
      <label for="remote-root">根目录
        <select id="remote-root" name="root" required>
          {% for name, source in remote_sources.items() %}{% for root in source.roots %}<option value="{{ root }}">{{ root }}</option>{% endfor %}{% endfor %}
        </select>
      </label>
      <label for="relative-path">相对路径<input id="relative-path" name="relative_path" required></label>
      <label for="target-name">数据集名称<input id="target-name" name="target_name" required maxlength="255"></label>
      <div class="commands"><button type="submit">开始导入</button><a href="/imports">取消</a></div>
    </form>
  </section>
{% endblock %}
